name: Bygg branch

on:
  workflow_call:
  push:
    branches-ignore:
      - master
      - main
      - tms-dependency-admin_*
    paths-ignore:
      - .github/**

jobs:
  build-branch:
    if: github.repository != 'navikt/tms-backend-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Sjekk ut koden
        uses: actions/checkout@v7

      - name: Sett opp java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Sett opp gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bygg og test prosjekt
        run: ./gradlew build
