name: Bygg branch

on:
  workflow_call:
    inputs:
      frontend-directory:
        description: 'Plassering til frontend, f.eks. web-app. Hvis tomt, kjøres ikke.'
        type: string
        default: ''
    secrets:
      READER_TOKEN:
        required: false
  push:
    branches-ignore:
      - master
      - main
      - tms-dependency-admin_*
    paths-ignore:
      - .github/**

jobs:
  build-branch:
    if: github.repository != 'navikt/tms-backend-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Sjekk ut koden
        uses: actions/checkout@v7

      - name: Sett opp java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Sett opp gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Sett opp pnpm
        if: inputs.frontend-directory != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: ${{ inputs.frontend-directory }}/package.json

      - name: Sett opp node
        if: inputs.frontend-directory != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.frontend-directory }}/pnpm-lock.yaml

      - name: Bygg og test prosjekt
        run: ./gradlew build

      - name: Installer frontend-avhengigheter
        if: inputs.frontend-directory != ''
        run: pnpm --dir "$FRONTEND_DIRECTORY" install --frozen-lockfile --strict-peer-dependencies=false
        env:
          FRONTEND_DIRECTORY: ${{ inputs.frontend-directory }}
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Kjør frontend-tester
        if: inputs.frontend-directory != ''
        run: pnpm --dir "$FRONTEND_DIRECTORY" test
        env:
          FRONTEND_DIRECTORY: ${{ inputs.frontend-directory }}

      - name: Bygg frontend-filer
        if: inputs.frontend-directory != ''
        run: pnpm --dir "$FRONTEND_DIRECTORY" build
        env:
          FRONTEND_DIRECTORY: ${{ inputs.frontend-directory }}
