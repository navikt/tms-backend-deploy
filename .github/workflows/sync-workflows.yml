name: Create missing backend workflows

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview missing workflows without creating branches or pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-backend-workflows
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow templates
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test workflow sync
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Create missing workflows
        env:
          WORKFLOW_SYNC_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: python3 scripts/sync_workflows.py
